[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "xmetai-inference"
version = "0.1.0"
description = "Configuration-driven weather model inference and evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "xmetai-core",
    "numpy",
    "pandas",
    "torch",
    "xarray",
]

[project.optional-dependencies]
netcdf = [
    "h5netcdf",
    "netCDF4",
]
zarr = [
    "zarr",
]
onnx = [
    "onnxruntime",
]
# Running tests: pytest itself plus the data-reading backends needed by the
# integration tests (realdata cases run only when all of these are installed).
# Install: pip install -e ".[dev]"
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "ruff>=0.0.250",
    "zarr",
    "h5netcdf",
    "onnxruntime",
]

[project.scripts]
xmetai-infer = "xmetai_inference.cli:main"

[tool.setuptools.packages.find]
include = ["xmetai_inference*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# --strict-markers: an unregistered marker is an error, so a typo in a marker does
# not silently take effect (e.g. -m realdaat would "select 0 tests" instead of failing).
#
# Default `-m 'not realdata'`: registering markers alone does not stop them from
# running, and the realdata suite starts a real GPU inference. On a machine with
# fixtures a plain `pytest` would run it incidentally at high cost, so it is explicit
# opt-in: use `pytest -m realdata` to run it (a command-line -m overrides this).
addopts = "-v --strict-markers -m 'not realdata'"
markers = [
    "realdata: requires real models and clipped data; the whole module is skipped when the fixture directory is incomplete or a dependency such as onnxruntime is missing",
]
