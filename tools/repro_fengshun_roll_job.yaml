# 复现 Job v2：跑 tools/repro_fengshun_roll.py —— 10 步自回归 rollout + 全 87 通道单步诊断。
#
# 与 v1（szw-repro-fengshun）的区别：v1 只跑了 1 步就去比第三方的第 10 步场，比错了。
#
# 前置（已就位）：
#   /workspace/szwCode/xmetai-inference-main/tools/repro_fengshun_roll.py
#   /workspace/szw_repro/10.npz, 10mean.npz        ← 参考场
#
# 用法（spec.template 不可变，重跑前先删）：
#     kubectl delete job szw-fengshun-roll -n bktk8bmh-default --ignore-not-found
#     kubectl apply -f tools/repro_fengshun_roll_job.yaml
#     kubectl logs -f job/szw-fengshun-roll -n bktk8bmh-default
#
# 预计 12 分钟（242 次前向 × 2.24s）。只要结论：
#     kubectl logs job/szw-fengshun-roll -n bktk8bmh-default | sed -n '/^E\./,$p'

apiVersion: batch/v1
kind: Job
metadata:
  name: &job_name szw-fengshun-roll
  namespace: bktk8bmh-default
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 60000000
  completionMode: NonIndexed
  completions: 1
  parallelism: 1
  suspend: false
  template:
    metadata:
      annotations:
        bingomatrix.bingosoft.net/ai-device-type: container0:Device,
        bingomatrix.bingosoft.net/isRDMAHostModel: "true"
        bingomatrix.bingosoft.net/vgpu-model-to-use: '[NVIDIA H100 80GB HBM3]'
        bingomatrix.bingosoft.net/vgpu-type: full
      labels:
        job-name: *job_name
    spec:
      containers:
      - name: container0
        image: registry.bingosoft.net/pytorch/pytorch:2.11.0-cuda12.8-mamba3-20260403
        imagePullPolicy: IfNotPresent
        command:
          - "bash"
          - "-c"
        args:
          - |
            set -eu
            export PYTHONIOENCODING=utf-8
            cd /workspace/szwCode/xmetai-inference-main

            echo "=================== 依赖自检 ==================="
            python3 - <<'PY'
            # 先 import torch，它才会把 nvidia-* 的 .so 目录挂上
            import torch
            import numpy, onnxruntime, zarr
            print("torch =", torch.__version__, "| ort =", onnxruntime.__version__,
                  "| numpy =", numpy.__version__, "| zarr =", zarr.__version__)
            print("providers =", onnxruntime.get_available_providers())
            PY

            echo "=================== rollout v2 ==================="
            python3 tools/repro_fengshun_roll.py
        resources: &resource_spec
          limits: &limits_spec
            cpu: "8"
            memory: 256Gi
            nvidia.com/vgpu: "1" # number of vGPUs
            nvidia.com/vgpu-cores: "100"
            nvidia.com/vgpu-mem: "81089"
          requests: *limits_spec
        volumeMounts:
        - mountPath: /workspace/
          name: &pvc_name pvc-8xxpvc
        - mountPath: /workspace/data
          name: &data_name hostpath-8xcmad
        - mountPath: /workspace/tmp
          name: &tmp_name hostpath-8xcmat
        - mountPath: /dev/shm
          name: &shm_name shm-e3tzzc
      restartPolicy: Never
      schedulerName: default-scheduler
      volumes:
      - name: *pvc_name
        persistentVolumeClaim:
          claimName: shenzw
      - name: *data_name
        hostPath:
          path: /share/data
          type: ""
      - name: *tmp_name
        hostPath:
          path: /share/tmp
          type: ""
      - name: *shm_name
        emptyDir:
          medium: Memory
          sizeLimit: 1024Gi
