# 探针 Job：在带 CUDA/cuDNN 的容器里跑 tools/probe_onnx.py --run。
#
# 为什么非得起 Job：Mamba3SisoFn 只有 CUDA 实现（CPU 上直接 NOT_IMPLEMENTED），
# dev pod 又缺 libcudnn.so.9，onnxruntime 的 CUDAExecutionProvider 起不来。
#
# 前置：更新后的 probe_onnx.py 必须在 /workspace/szwCode/xmetai-inference-main/tools/
#
# 用法（Job 的 spec.template 不可变，重跑前先删）：
#     kubectl delete job szw-probe-fengshun -n bktk8bmh-default --ignore-not-found
#     kubectl apply -f tools/probe_onnx_job.yaml
#     kubectl logs -f job/szw-probe-fengshun -n bktk8bmh-default
#
# 只看结论：
#     kubectl logs job/szw-probe-fengshun -n bktk8bmh-default | sed -n '/7. 归一化/,$p'

apiVersion: batch/v1
kind: Job
metadata:
  name: &job_name szw-probe-fengshun
  namespace: bktk8bmh-default
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 60000000
  completionMode: NonIndexed
  completions: 1
  parallelism: 1
  suspend: false
  template:
    metadata:
      annotations:
        bingomatrix.bingosoft.net/ai-device-type: container0:Device,
        bingomatrix.bingosoft.net/isRDMAHostModel: "true"
        bingomatrix.bingosoft.net/vgpu-model-to-use: '[NVIDIA H100 80GB HBM3]'
        bingomatrix.bingosoft.net/vgpu-type: full
      labels:
        job-name: *job_name
    spec:
      containers:
      - name: container0
        image: registry.bingosoft.net/pytorch/pytorch:2.11.0-cuda12.8-mamba3-20260403
        imagePullPolicy: IfNotPresent
        command:
          - "bash"
          - "-c"
        args:
          - |
            set -eu
            export PYTHONIOENCODING=utf-8
            cd /workspace/szwCode/xmetai-inference-main

            echo "=================== 环境自检 ==================="
            python3 -V
            nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader || true
            python3 - <<'PY'
            # 先 import torch，它才会把 nvidia-* 的 .so 目录挂上，否则 providers 里没有 CUDA
            import torch
            print("torch            =", torch.__version__)
            import onnxruntime as o
            print("onnxruntime      =", o.__version__)
            print("providers        =", o.get_available_providers())
            try:
                import onnx
                print("onnx             =", onnx.__version__)
            except ImportError:
                print("onnx             = <缺失，图结构段会跳过>")
            PY

            echo "=================== 探针 ==================="
            # --run：全零输入跑一次，用来看输出到底几帧、量级在哪。
            # 插件库不显式给，探针自己扫同目录按 ORT 版本挑。
            python3 tools/probe_onnx.py \
              /workspace/tmp/douzsh/models/fengshun2.0_260901.onnx \
              --no-ls --ort --run \
              --json /workspace/tmp/probe_fengshun2.json
        resources: &resource_spec
          limits: &limits_spec
            cpu: "8"
            memory: 256Gi
            nvidia.com/vgpu: "1" # number of vGPUs
            nvidia.com/vgpu-cores: "100"
            nvidia.com/vgpu-mem: "81089"
          requests: *limits_spec
        volumeMounts:
        - mountPath: /workspace/
          name: &pvc_name pvc-8xxpvc
        - mountPath: /workspace/data
          name: &data_name hostpath-8xcmad
        - mountPath: /workspace/tmp
          name: &tmp_name hostpath-8xcmat
        - mountPath: /dev/shm
          name: &shm_name shm-e3tzzc
      restartPolicy: Never
      schedulerName: default-scheduler
      volumes:
      - name: *pvc_name
        persistentVolumeClaim:
          claimName: shenzw
      - name: *data_name
        hostPath:
          path: /share/data
          type: ""
      - name: *tmp_name
        hostPath:
          path: /share/tmp
          type: ""
      - name: *shm_name
        emptyDir:
          medium: Memory
          sizeLimit: 1024Gi
