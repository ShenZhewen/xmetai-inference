# 测试 Job：tests/unit 全量 + tests/integration 的 realdata 档（真起 GPU 推理对拍）。
#
# 1.0（main 分支）已删除 SPA/SPW 实现与配方、skills/。服务器副本如果是 rsync 增量同步
# 过来的（不带 --delete），旧文件会残留；下面有一段「剥离自检」把它们列出来，但只提示、
# 不拦测试（残留文件不参与 import，不影响用例结果）。
#
# 集成档必须显式 -m realdata（pyproject 的 addopts 默认排除）；fixture 不齐时整模块
# skip、退出码仍是 0，所以加 -rs 把 skip 原因打出来。
#
# 用法（Job 的 spec.template 不可变，重跑前先删）：
#     kubectl delete job szw-test-all -n bktk8bmh-default --ignore-not-found
#     kubectl apply -f tests/all_tests_job.yaml
#     kubectl logs -f job/szw-test-all -n bktk8bmh-default
#
# 只看集成档结论：
#     kubectl logs job/szw-test-all -n bktk8bmh-default | sed -n '/集成测试/,$p'

apiVersion: batch/v1
kind: Job
metadata:
  name: &job_name szw-test-all
  namespace: bktk8bmh-default
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 60000000
  completionMode: NonIndexed
  completions: 1
  parallelism: 1
  suspend: false
  template:
    metadata:
      annotations:
        bingomatrix.bingosoft.net/ai-device-type: container0:Device,
        bingomatrix.bingosoft.net/isRDMAHostModel: "true"
        bingomatrix.bingosoft.net/vgpu-model-to-use: '[NVIDIA H100 80GB HBM3]'
        bingomatrix.bingosoft.net/vgpu-type: full
      labels:
        job-name: *job_name
    spec:
      containers:
      - name: container0
        image: registry.bingosoft.net/pytorch/pytorch:2.11.0-cuda12.8-mamba3-20260403
        imagePullPolicy: IfNotPresent
        command:
          - "bash"
          - "-c"
        args:
          - |
            set -eu
            export PYTHONIOENCODING=utf-8
            export PYTHONPATH=/workspace/szwCode/xmetai-inference-main
            export XMETAI_INFERENCE_ROOT=/workspace/szwCode/xmetai-inference-main

            # --- 依赖：这个环境连不上 PyPI，全走本地 wheel ---
            # 独立成行 + set -eu：一条 pip 失败就停，不要静默跑下去。
            pip install /workspace/szwCode/iniconfig-2.3.1-py3-none-any.whl  --break-system-packages
            pip install /workspace/szwCode/pluggy-1.6.0-py3-none-any.whl --break-system-packages
            pip install /workspace/szwCode/pytest-9.1.1-py3-none-any.whl --break-system-packages
            pip install /workspace/szwCode/xmetai-inference2/h5py-3.16.0-cp312-cp312-manylinux_2_28_x86_64.whl --break-system-packages
            pip install /workspace/szwCode/xmetai-inference2/xmetai_core-0.1.0-py3-none-any.whl --break-system-packages

            # pytest 收相对路径，容器 WORKDIR 不是仓库根，必须先 cd。
            cd /workspace/szwCode/xmetai-inference-main

            echo "=================== 环境自检 ==================="
            echo "cwd                  = $(pwd)"
            echo "python               = $(python -V 2>&1)"
            echo "CUDA_VISIBLE_DEVICES = ${CUDA_VISIBLE_DEVICES-<未设>}"
            echo "xmetai_inference     = $(python -c 'import xmetai_inference,os;print(os.path.dirname(xmetai_inference.__file__))')"
            # 重构后的模块落位：先做一次 import 冒烟，别等 pytest 收集时才炸。
            python -c 'from xmetai_inference.utils.runner import Rollout, Trajectory; from xmetai_inference.utils.dataloader_factory import create_dataloader; from xmetai_inference.data.weather import create_processed_multi_zarr_dataset; print("模块布局             = OK")'
            # 集成档缺 onnxruntime 会整模块 skip（退出码仍是 0），这里显式看一眼。
            python -c 'import onnxruntime as o; print("onnxruntime          =", o.__version__)' \
              || echo "onnxruntime          = <缺失，集成档会 skip>"
            echo "--- 关键依赖 ---"
            pip list 2>/dev/null | grep -Ei '^(pytest|zarr|xarray|h5netcdf|h5py|netCDF4|onnxruntime|xmetai)' || true

            echo "=================== fixture 清单 ==================="
            ls -la /workspace/data/shenzw/inference_test_data/ || true
            for d in fgvp_test_data fgvp_ens_test_data fuxi_test_data; do
              echo "--- $d ---"
              ls -la "/workspace/data/shenzw/inference_test_data/$d" 2>/dev/null || echo "<缺失>"
            done

            echo "=================== 1.0 剥离自检 ==================="
            # 只提示不退出：残留文件不参与 import，不影响用例结果。
            for p in \
              xmetai_inference/weights \
              xmetai_inference/backends/spa.py \
              skills \
              xmetai_inference/configs/s2s_era_1p5_fengshun_ens_spa.py \
              xmetai_inference/configs/weather_cra_0p25_tongyun_ens_spa.py \
              xmetai_inference/configs/weather_era_0p25_fgvp_ens_spa.py \
              xmetai_inference/configs/weather_era_0p25_fuxi_ens_spa.py \
              xmetai_inference/configs/weather_era_0p25_fgvp_ens_spw.py \
              ; do
              if [ -e "$p" ]; then
                echo "  ⚠ 残留：$p（1.0 已删除，服务器副本需手工清理）"
              fi
            done
            echo -n "内置配方："
            ls xmetai_inference/configs/*.py | sed 's#.*/##' | sort | tr '\n' ' '
            echo

            # 两档都跑：单元档挂了不拦集成档，最后按「任一失败」退出。
            rc=0

            echo "=================== 单元测试 ==================="
            python -m pytest tests/unit -v || rc=$?

            echo "=================== 集成测试（真起 GPU 推理）==================="
            python -m pytest tests/integration -m realdata -v -s -rs || rc=$?

            echo "=================== 汇总 ==================="
            if [ "$rc" -eq 0 ]; then
              echo "全部通过（集成档若有 skip，原因见上面 -rs 输出）"
            else
              echo "有失败，退出码 $rc"
            fi
            exit "$rc"
        resources: &resource_spec
          limits: &limits_spec
            cpu: "8"
            memory: 256Gi
            nvidia.com/vgpu: "1" # number of vGPUs
            nvidia.com/vgpu-cores: "100"
            nvidia.com/vgpu-mem: "81089"
          requests: *limits_spec
        volumeMounts:
        - mountPath: /workspace/
          name: &pvc_name pvc-8xxpvc
        - mountPath: /workspace/data
          name: &data_name hostpath-8xcmad
        - mountPath: /workspace/tmp
          name: &tmp_name hostpath-8xcmat
        - mountPath: /dev/shm
          name: &shm_name shm-e3tzzc
      restartPolicy: Never
      schedulerName: default-scheduler
      volumes:
      - name: *pvc_name
        persistentVolumeClaim:
          claimName: shenzw
      - name: *data_name
        hostPath:
          path: /share/data
          type: ""
      - name: *tmp_name
        hostPath:
          path: /share/tmp
          type: ""
      - name: *shm_name
        emptyDir:
          medium: Memory
          sizeLimit: 1024Gi
